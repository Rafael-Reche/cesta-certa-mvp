# Blueprint do Render: serviço web (Django) + PostgreSQL gratuito.
services:
  - type: web
    name: cesta-certa
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: ./start.sh
    healthCheckPath: /saude/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cesta-certa-db
          property: connectionString
      - key: DEMO_SENHA
        sync: false
databases:
  - name: cesta-certa-db
    plan: free
    databaseName: cestacerta
    user: cestacerta
