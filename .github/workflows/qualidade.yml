name: Qualidade do PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  commits-semanticos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificar mensagens de commit (feat, fix, test, docs, ci, refactor, chore)
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          erros=0
          while IFS= read -r msg; do
            if ! printf '%s' "$msg" | grep -Eq '^(feat|fix|test|docs|ci|refactor|chore)(\([a-z0-9-]+\))?: .+'; then
              echo "Fora do padrão semântico: $msg"
              erros=1
            fi
          done < <(git log --no-merges --format=%s "origin/${BASE_REF}..${HEAD_SHA}")
          exit $erros

  segredos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Procurar segredos óbvios no código
        run: |
          if git grep -nEi -e '-----BEGIN [A-Z ]*PRIVATE KEY-----' -e 'AKIA[0-9A-Z]{16}' -e 'ghp_[A-Za-z0-9]{30,}' -e "api[_-]?key[[:space:]]*=[[:space:]]*['\"][^'\"]{8,}" -- . ':!.github/workflows/qualidade.yml'; then
            echo "Possível segredo encontrado. Remova antes do merge."
            exit 1
          fi
          echo "Nenhum segredo óbvio encontrado."

  checklist-do-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Exigir que o checklist de auto-revisão esteja todo marcado
        env:
          CORPO: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$CORPO" | grep -q -- '- \[ \]'; then
            echo "Há itens do checklist sem marcar. Revise e marque apenas o que foi conferido."
            exit 1
          fi
          echo "Checklist completo."
