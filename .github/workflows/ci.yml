name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-e-testes:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: chave-somente-para-ci
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Build (verificação do projeto e das migrações)
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Testes unitários e de integração com cobertura
        run: coverage run manage.py test --verbosity 2

      - name: Relatório de cobertura (mínimo de 80%)
        run: coverage report --fail-under=80
